<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<meta name="description" content="CrewDesk: crew onboarding, contracts, invoices, approvals, payments and call sheets for film, TV and ad productions.">
<title>CrewDesk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f2a44'/%3E%3Cpath d='M7 12h18v13H7z' fill='%23f2b544'/%3E%3Cpath d='M7 7l18-2 .8 5L7.8 12z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f4f5f8; --surface:#fff; --surface-2:#eef0f5; --ink:#161b26; --ink-2:#5b6478; --line:#dfe2ea;
  --brand:#1f2a44; --brand-ink:#fff; --accent:#d9951d; --accent-bg:#fdf3e1;
  --ok:#1f7a4d; --ok-bg:#e2f3ea; --warn:#a85d00; --warn-bg:#fdf0dc; --bad:#b3261e; --bad-bg:#fbe5e3; --info:#2f56b0; --info-bg:#e5ecfb;
  --radius:14px; --shadow:0 1px 2px rgba(20,25,40,.05),0 6px 20px rgba(20,25,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f131c; --surface:#171c28; --surface-2:#202736; --ink:#e9ecf3; --ink-2:#9aa3b8; --line:#2a3244;
    --brand:#2b3a5e; --brand-ink:#fff; --accent:#f2b544; --accent-bg:#3a2d12;
    --ok:#5fd09a; --ok-bg:#15301f; --warn:#f2b544; --warn-bg:#3a2d12; --bad:#ff8a80; --bad-bg:#3d1d1b; --info:#8fb0ff; --info-bg:#1b2645; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f131c; --surface:#171c28; --surface-2:#202736; --ink:#e9ecf3; --ink-2:#9aa3b8; --line:#2a3244;
  --brand:#2b3a5e; --brand-ink:#fff; --accent:#f2b544; --accent-bg:#3a2d12;
  --ok:#5fd09a; --ok-bg:#15301f; --warn:#f2b544; --warn-bg:#3a2d12; --bad:#ff8a80; --bad-bg:#3d1d1b; --info:#8fb0ff; --info-bg:#1b2645; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
[hidden]{display:none !important}
.shell{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.bar{position:sticky;top:0;z-index:10;background:var(--brand);color:var(--brand-ink);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
header.bar .title{flex:1;min-width:0}
header.bar .title b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.bar .title small{opacity:.75;font-size:12px}
header.bar button{background:rgba(255,255,255,.12);border:0;color:inherit;border-radius:10px;min-width:40px;height:40px;cursor:pointer;font-weight:700;padding:0 12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.01em}
.demo-band{background:var(--accent-bg);color:var(--warn);font-size:12.5px;padding:6px 16px;display:flex;gap:10px;justify-content:space-between;align-items:center}
.demo-band button{border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;font-size:12.5px;padding:0}
main{flex:1;padding:16px;padding-bottom:100px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .inner{display:flex;width:100%;max-width:760px}
nav.tabs a{flex:1;text-decoration:none;color:var(--ink-2);font-size:11.5px;font-weight:600;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs a[aria-current="page"]{color:var(--accent)}}
nav.tabs .dot{position:absolute;top:4px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;line-height:17px;padding:0 4px}
h1{font-size:22px;line-height:1.2;margin:0 0 4px}
h2{font-size:16px;margin:22px 0 10px}
h3{font-size:15px;margin:0}
p{margin:0 0 8px}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px}
.field textarea{min-height:80px;resize:vertical}
.field .hint{font-size:12px;color:var(--ink-2)}
.field .err{font-size:12px;color:var(--bad)}
.field input[aria-invalid="true"]{border-color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;min-height:44px;background:var(--brand);color:var(--brand-ink);text-decoration:none;white-space:nowrap}
.btn.block{width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--surface);color:var(--bad);border:1px solid var(--line)}
.btn.accent{background:var(--accent);color:#1b1305}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;min-height:36px}
a.chip{color:var(--ink);text-decoration:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-weight:800;margin-left:4px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:inherit;cursor:pointer;width:100%;text-align:left}
.item .meta{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:800;color:var(--ink-2);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:clamp(14px,4.6vw,20px);line-height:1.15;overflow-wrap:anywhere}
.kpi span{font-size:12px;color:var(--ink-2)}
.alert{border-radius:12px;padding:12px 14px;font-size:14px}
.alert.warn{background:var(--warn-bg);color:var(--warn)} .alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.info{background:var(--info-bg);color:var(--info)} .alert.ok{background:var(--ok-bg);color:var(--ok)}
.empty{text-align:center;color:var(--ink-2);padding:28px 12px}
.money{font-variant-numeric:tabular-nums;font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:12px;color:var(--ink-2);font-weight:600}
table.t td.r,table.t th.r{text-align:right}
.tablewrap{overflow-x:auto}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.over{background:var(--bad)}
.doc{background:#fff;color:#111;border:1px solid var(--line);border-radius:8px;padding:22px;font:14px/1.6 Georgia,"Times New Roman",serif;white-space:pre-wrap;word-wrap:break-word}
.sig{border:1px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;width:100%;height:160px;display:block}
.timeline{list-style:none;padding:0;margin:0;font-size:13px}
.timeline li{padding:6px 0 6px 16px;border-left:2px solid var(--line);position:relative}
.timeline li::before{content:'';position:absolute;left:-6px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
.idcard{max-width:340px;margin:0 auto;background:var(--brand);color:#fff;border-radius:18px;padding:20px;text-align:center}
.idcard .qr{background:#fff;border-radius:12px;padding:12px;display:inline-block;margin:14px 0 8px}
.idcard .qr img,.idcard .qr canvas{display:block;width:180px;height:180px;image-rendering:pixelated}
.idcard .code{font:700 20px/1 ui-monospace,Menlo,monospace;letter-spacing:.15em}
dialog{border:0;border-radius:18px 18px 0 0;padding:0;width:100%;max-width:760px;margin:auto auto 0;background:var(--surface);color:var(--ink);max-height:92vh}
dialog::backdrop{background:rgba(10,12,20,.5)}
dialog .sheet{padding:18px 16px 22px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.persona{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.center{text-align:center}
.hero{padding:28px 4px 10px}
.hero h1{font-size:28px}
.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.feature-grid div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px}
.feature-grid b{display:block;font-size:14px;margin-bottom:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#print{display:none}
@media print{
  body{background:#fff}
  .shell,dialog,.toast{display:none !important}
  #print{display:block;color:#000;font:12pt/1.5 Georgia,serif}
  #print .doc{border:0;padding:0;font-size:12pt}
  #print table{width:100%;border-collapse:collapse}
  #print th,#print td{border:1px solid #999;padding:5px 7px;text-align:left;font-family:system-ui,sans-serif;font-size:10pt}
}
</style>
</head>
<body>
<div class="shell">
  <header class="bar" id="bar"></header>
  <div class="demo-band" id="demoBand" hidden></div>
  <main id="view" tabindex="-1"><div class="empty">Loading CrewDesk…</div></main>
  <nav class="tabs" id="tabs" hidden aria-label="Project sections"><div class="inner"></div></nav>
</div>
<dialog id="dlg"><div class="sheet" id="dlgBody"></div></dialog>
<div id="print"></div>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
