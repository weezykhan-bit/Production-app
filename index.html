<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}/* notification bell and panel (live app only) */
.bell{position:relative;display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;color:var(--fg);flex:none}
.bell:hover{border-color:var(--accent)}
.bell .badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--bad);color:var(--surface);font:600 11px/19px var(--f-mono);text-align:center}
.notes{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:58px;width:min(400px,calc(100vw - 32px));max-height:min(560px,calc(100vh - 90px));overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:31;display:grid;align-content:start}
.notes header{padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.notes ul{list-style:none;margin:0;padding:4px}
.notes li button{width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:10px;display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;cursor:pointer;color:inherit;font:inherit}
.notes li button:hover{background:var(--surface-2)}
.notes .dot{width:8px;height:8px;border-radius:50%;margin-top:6px}
.notes .unread .dot{background:var(--accent)}
.notes .tx{display:grid;gap:2px;min-width:0;font-size:13px;overflow-wrap:anywhere}
.notes .tx b{font-weight:500;color:var(--muted)}
.notes .unread .tx b{font-weight:600;color:var(--fg)}
.notes .tx span{color:var(--muted)}
.notes time{font:11px var(--f-mono);color:var(--muted)}
.notes li.none{padding:22px 16px;text-align:center;color:var(--muted);font-size:13px}
.notes-perm{margin:8px 10px 0;border:1px dashed var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;font:inherit;font-size:12px;cursor:pointer;text-align:left;color:var(--fg)}
/* Google sign-in */
.gbtn{width:100%;justify-content:center;gap:10px;background:var(--surface);border:1px solid var(--line);font-weight:600;padding:11px 14px}
.gbtn:hover{border-color:var(--fg)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:4px 0}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.gcard{gap:12px}
.gcard .gbtn{padding:14px;font-size:15px}
.pwbox{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 14px}
.pwbox summary{cursor:pointer;padding:12px 0;font-weight:600;color:var(--muted);list-style-position:inside}
.pwbox[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
.pwbox form{padding-bottom:14px}
.helpbox{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:4px}
.helpbox p{margin:0}
/* welcome video on first sign-in */
.dialog.dlg-welcome{width:min(940px,100%);padding:0;overflow:hidden}
.welcome{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.welcome.port{grid-template-columns:minmax(0,300px) minmax(0,1fr)}
.w-video{background:#0d2a28;display:grid;place-items:center;padding:16px}
.w-video video{width:100%;border-radius:10px;display:block;background:#0b6b66}
.welcome.port .w-video video{aspect-ratio:390/844;max-height:70vh;width:auto;max-width:100%}
.welcome.land .w-video video{aspect-ratio:16/10}
.w-text{padding:26px 26px 22px;display:grid;gap:12px;align-content:start;position:relative}
.w-text h2{font:700 26px/1.15 var(--f-display);margin:0;padding-right:36px}
.w-text p{margin:0}
.w-x{position:absolute;top:14px;right:14px}
.w-steps{list-style:none;counter-reset:s;margin:4px 0;padding:0;display:grid;gap:10px}
.w-steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:10px}
.w-steps li::before{content:counter(s);grid-row:span 2;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 13px var(--f-display)}
.w-steps b{font-weight:600}
.w-steps span{color:var(--muted);font-size:13px}
@media (max-width:760px){
  .welcome,.welcome.port{grid-template-columns:minmax(0,1fr)}
  .welcome.port .w-video video{max-height:46vh}
  .w-text{padding:20px 18px}
  .w-text h2{font-size:22px}
}
</style>
<title>CrewDesk</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — slim nav rail + working canvas; on phones the rail becomes a scrolling tab row. */
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --surface-2:#E7EDED; --line:#D2DBDB; --fg:#13211F; --muted:#56696A;
  --accent:#0B6B66; --accent-ink:#FFFFFF; --accent-soft:#D3EAE7; --marigold:#B87A06; --marigold-soft:#F6E7C6;
  --good:#2D7A4B; --good-soft:#DCEFE2; --warn:#9A6408; --warn-soft:#F5E6C8; --bad:#B03A2E; --bad-soft:#F6DCD8; --info:#2B5C9C; --info-soft:#DCE6F4;
  --paper:#FFFFFF; --sig-ink:#1B2A6B; --shadow:0 1px 2px rgb(10 30 30 / .05),0 10px 28px -8px rgb(10 30 30 / .14);
  --shadow-sm:0 1px 2px rgb(10 30 30 / .05),0 1px 1px rgb(10 30 30 / .03); --shadow-lg:0 2px 6px rgb(10 30 30 / .06),0 28px 64px -16px rgb(10 30 30 / .28);
  --ease:cubic-bezier(.16,1,.3,1); --line-strong:#B9C6C6;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1515; --surface:#132020; --surface-2:#1A2A2A; --line:#2A3C3C; --fg:#E3EDEC; --muted:#8FA4A3;
  --accent:#43B8AE; --accent-ink:#04211F; --accent-soft:#133A37; --marigold:#E7B341; --marigold-soft:#3A2E12;
  --good:#5DC086; --good-soft:#163323; --warn:#E3AA4C; --warn-soft:#3A2C12; --bad:#EC7B70; --bad-soft:#3D1B18; --info:#86ABE6; --info-soft:#18273D;
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 10px 28px -8px rgb(0 0 0 / .5); --shadow-sm:0 1px 2px rgb(0 0 0 / .35); --shadow-lg:0 2px 6px rgb(0 0 0 / .4),0 28px 64px -16px rgb(0 0 0 / .65); --line-strong:#3B5050; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1515; --surface:#132020; --surface-2:#1A2A2A; --line:#2A3C3C; --fg:#E3EDEC; --muted:#8FA4A3;
  --accent:#43B8AE; --accent-ink:#04211F; --accent-soft:#133A37; --marigold:#E7B341; --marigold-soft:#3A2E12;
  --good:#5DC086; --good-soft:#163323; --warn:#E3AA4C; --warn-soft:#3A2C12; --bad:#EC7B70; --bad-soft:#3D1B18; --info:#86ABE6; --info-soft:#18273D;
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 10px 28px -8px rgb(0 0 0 / .5); --shadow-sm:0 1px 2px rgb(0 0 0 / .35); --shadow-lg:0 2px 6px rgb(0 0 0 / .4),0 28px 64px -16px rgb(0 0 0 / .65); --line-strong:#3B5050; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;caret-color:var(--accent);scrollbar-color:var(--line-strong) transparent}
::selection{background:color-mix(in srgb,var(--accent) 24%,transparent);color:var(--fg)}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px;border:2px solid var(--bg)} ::-webkit-scrollbar-thumb:hover{background:var(--line-strong)} ::-webkit-scrollbar-track{background:transparent}
a{text-underline-offset:3px;text-decoration-thickness:1px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,3.4vw,34px);letter-spacing:-.022em} h2{font-size:20px;letter-spacing:-.015em} h3{font-size:16px}
p{margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.meta{font-size:13.5px;color:var(--muted);margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:500;cursor:pointer;white-space:nowrap;line-height:1.2;box-shadow:var(--shadow-sm);
  transition:background-color .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease),transform .12s var(--ease)}
.btn:hover{border-color:var(--line-strong);background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.btn.primary{background:var(--accent);border-color:color-mix(in srgb,var(--accent) 80%,#000);color:var(--accent-ink);
  box-shadow:inset 0 1px 0 rgb(255 255 255 / .16),0 1px 2px rgb(5 40 38 / .2),0 6px 16px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.panel.rm{border-color:color-mix(in srgb,var(--bad) 35%,var(--line));background:linear-gradient(0deg,var(--surface),color-mix(in srgb,var(--bad-soft) 45%,var(--surface)))}
.panel.rm p{margin:0}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack{display:grid;gap:14px}
label.f{display:grid;gap:5px;font-size:13px;font-weight:500;min-width:0}
label.f span.hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=search],input[type=password],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=time],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-width:0;transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
input:hover:not(:focus),select:hover:not(:focus),textarea:hover:not(:focus){border-color:var(--line-strong)}
::placeholder{color:color-mix(in srgb,var(--muted) 85%,var(--surface))}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.err{color:var(--bad);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow-sm)}
.panel>h2,.panel>h3{margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent)} .chip.gold{background:var(--marigold-soft);color:var(--marigold)}
.slate{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;font:500 12px/1 var(--f-mono)}
.slate span{padding:6px 9px;border-right:1px solid var(--line);white-space:nowrap}
.slate span:last-child{border-right:0}
.slate span b{color:var(--muted);font-weight:500;margin-right:6px}

/* ---------- login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.login-brand{background:var(--accent);color:var(--accent-ink);padding-block:48px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:40px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.login-brand h1{font-size:clamp(34px,5vw,54px);max-width:12ch}
.login-brand p{max-width:42ch;opacity:.9;font-size:16px}
.clap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1.5px solid currentColor;border-radius:8px;max-width:440px;font:500 12px/1.3 var(--f-mono)}
.clap div{padding:10px 12px;border-right:1.5px solid currentColor}
.clap div:last-child{border-right:0}
.clap small{display:block;opacity:.7;letter-spacing:.1em;text-transform:uppercase;font-size:10px;margin-bottom:4px}
.stripes{position:absolute;right:-60px;top:28px;width:300px;height:38px;background:repeating-linear-gradient(-45deg,currentColor 0 22px,transparent 22px 44px);opacity:.14;transform:rotate(-8deg)}
.login-form{padding-block:48px;padding-left:40px;padding-right:max(40px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;justify-content:center;gap:22px;max-width:520px;width:100%}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:9px;width:max-content}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.demo-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.demo-list button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;cursor:pointer;display:grid;gap:2px;min-width:0}
.demo-list button:hover{border-color:var(--accent)}
.demo-list b{font-weight:600;font-size:14px}
.demo-list span{font-size:12px;color:var(--muted)}
@media (max-width:820px){
  .login{grid-template-columns:minmax(0,1fr)}
  .login-brand{padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .login-form{padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:none}
  .demo-list{grid-template-columns:minmax(0,1fr)}
}

/* ---------- shell */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(12px);backdrop-filter:saturate(1.5) blur(12px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font:700 18px/1 var(--f-display);cursor:pointer;border:0;background:none;padding:0}
.brand i{width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:13px}
.top .proj{min-width:0;flex:0 1 280px}
.top .grow{flex:1}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;background:var(--surface);cursor:pointer}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 12px/1 var(--f-body);background:var(--accent-soft);color:var(--accent);flex:none}
.me .who{display:grid;line-height:1.15;text-align:left}
.me .who small{color:var(--muted);font-size:11px}
.menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:56px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:grid;min-width:220px;z-index:30}
.menu button{text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--surface-2)}
.shell{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:calc(100vh - 57px)}
.rail{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:57px;align-self:start;height:calc(100vh - 57px)}
.rail button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 11px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500;text-align:left;transition:background-color .15s var(--ease),color .15s var(--ease)}
.rail button:hover{background:var(--surface-2);color:var(--fg)}
.rail button[aria-current=page]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail .count{margin-left:auto;font:600 11px/1 var(--f-mono);background:var(--marigold);color:var(--surface);border-radius:999px;padding:3px 6px}
.rail .sep{height:1px;background:var(--line);margin:10px 4px}
.rail .note{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:8px}
main{padding-block:24px 96px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0;display:grid;gap:20px;align-content:start}
.wrap{max-width:1180px;width:100%;margin:0 auto;display:grid;gap:20px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));gap:4px}
  .rail button{white-space:nowrap;padding:8px 10px}
  .rail .sep,.rail .note{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .me .who{display:none}
  .top .proj{flex-basis:180px}
}
@media (max-width:520px){.brand span{display:none}}

/* ---------- page parts */
.head{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.head .t{display:grid;gap:8px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px;min-width:0;box-shadow:var(--shadow-sm)}
.kpi .v{font:600 26px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.attn{border-color:color-mix(in srgb,var(--marigold) 55%,var(--line));background:linear-gradient(0deg,var(--surface),color-mix(in srgb,var(--marigold-soft) 50%,var(--surface)))}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}}
.todo{display:grid;gap:0}
.todo li{list-style:none;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line)}
.todo li:first-child{border-top:0}
.todo ul{margin:0;padding:0}
.todo .what{display:grid;gap:2px;min-width:0}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px}
.bar .fill.over{background:var(--bad)}
.bar .val{text-align:right;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
@media (max-width:520px){.bar{grid-template-columns:100px minmax(0,1fr) 70px}}
.funnel{display:grid;gap:8px}
.funnel .step{display:grid;grid-template-columns:140px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.funnel .track{height:22px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.funnel .fill{height:100%;background:var(--accent);opacity:.85;border-radius:5px}
.funnel .n{font:600 13px/1 var(--f-mono);text-align:right}
.feed{display:grid;gap:0;margin:0;padding:0}
.feed li{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.feed li:first-child{border-top:0}
.feed time{font:12px var(--f-mono);color:var(--muted);white-space:nowrap}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click td{transition:background-color .15s var(--ease)}
tbody tr.click:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
td.r,th.r{text-align:right}
td .sub{display:block;color:var(--muted);font-size:12px}
.linkbtn{display:block;margin-left:auto;border:0;background:none;padding:2px 0 0;color:var(--accent);cursor:pointer;font-weight:600}
.linkbtn:hover{text-decoration:underline}
td.remark{max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.wide{min-width:1220px}
table.wide td.num,table.wide td.small{white-space:nowrap}
table.wide td .sub{white-space:normal}
.seg .n{font-family:var(--f-mono);margin-left:6px;opacity:.7}
.seg + .filters{margin-top:-4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:500;transition:background-color .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease)}
.fchip:hover{border-color:var(--line-strong);color:var(--fg)}
.fchip[aria-pressed=true]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.fchip .n{font-family:var(--f-mono);margin-left:4px;opacity:.75}
.search{flex:1 1 220px;max-width:320px}

.dots{display:flex;gap:4px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.dots i.now{background:var(--marigold-soft);border-color:var(--marigold)}

.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;counter-reset:s}
.stepper div{display:grid;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.stepper div::before{content:"";height:5px;border-radius:999px;background:var(--surface-2)}
.stepper div.on{color:var(--fg)}
.stepper div.on::before{background:var(--accent)}
.stepper div.now{color:var(--marigold);font-weight:600}
.stepper div.now::before{background:var(--marigold)}
@media (max-width:640px){.stepper{grid-template-columns:repeat(3,minmax(0,1fr))}}

.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
@media (max-width:400px){.projects{grid-template-columns:minmax(0,1fr)}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;cursor:pointer;text-align:left;min-width:0}
.pcard{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease)}
.pcard:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));box-shadow:var(--shadow);transform:translateY(-2px)}
.pcard .meter{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.pcard .meter span{display:block;height:100%;background:var(--marigold)}
.pcard .stats{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.pcard .stats b{color:var(--fg);font-family:var(--f-mono)}

/* drawer & modal */
@keyframes fade{from{opacity:0}}
@keyframes slide-in{from{transform:translateX(28px);opacity:.4}}
@keyframes rise{from{transform:translateY(10px) scale(.985);opacity:0}}
@keyframes toast{from{transform:translate(-50%,10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.scrim{position:fixed;inset:0;background:rgb(5 18 17 / .42);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);z-index:40;animation:fade .22s var(--ease)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:var(--shadow-lg);border-left:1px solid var(--line);animation:slide-in .38s var(--ease);padding-block:max(20px,env(safe-area-inset-top,0px)) max(40px,env(safe-area-inset-bottom,0px));padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:16px;align-content:start}
@media (max-width:640px){.drawer{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.modal>.scrim{z-index:0}
.dialog{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);border:1px solid var(--line);animation:rise .32s var(--ease);width:min(600px,100%);max-height:calc(100vh - 32px);overflow-y:auto;padding:22px;display:grid;gap:16px;position:relative;z-index:1}
.dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;font-size:14px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.dl{grid-template-columns:minmax(0,1fr)}.dl dt{margin-top:6px}}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;justify-content:space-between}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h3{display:flex;gap:10px;align-items:center}
details.sec .body{padding:0 16px 16px;display:grid;gap:14px}
.stepn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 12px/1 var(--f-mono);background:var(--surface-2);color:var(--muted);flex:none}
.stepn.on{background:var(--accent);color:var(--accent-ink)}
.stepn.now{background:var(--marigold);color:var(--surface)}
.docs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.docs{grid-template-columns:minmax(0,1fr)}}
.doc{border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;min-width:0;background:var(--surface)}
.doc img{width:100%;aspect-ratio:1.58;object-fit:cover;border-radius:6px;background:var(--surface-2)}
.docph{aspect-ratio:1.58;max-width:100%;border-radius:6px;background:linear-gradient(135deg,var(--accent-soft),var(--surface-2));display:grid;place-items:center;color:var(--accent);font:500 12px/1.3 var(--f-mono);text-align:center;padding:8px}
.agreement{background:var(--paper);color:#1B2424;border:1px solid var(--line);border-radius:8px;padding:18px;font:13px/1.65 var(--f-mono);white-space:pre-wrap;max-height:300px;overflow:auto}
.sigpad{display:block;width:100%;height:150px;background:var(--paper);color:var(--sig-ink);border:1.5px dashed var(--line);border-radius:8px;touch-action:none;cursor:crosshair}
.sigimg{background:var(--paper);border-radius:6px;padding:4px;max-width:240px;height:auto}
.idcard{border-radius:14px;padding:18px;background:var(--accent);color:var(--accent-ink);display:grid;gap:10px;max-width:360px}
.idcard .code{font:600 22px/1 var(--f-mono);letter-spacing:.08em}
.calc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;font-size:14px;background:var(--surface-2);border-radius:8px;padding:12px 14px}
.calc .num{text-align:right}
.calc .tot{font-weight:600;border-top:1px solid var(--line);padding-top:6px}
.diff{font:12px var(--f-mono)}
.diff del{color:var(--bad);text-decoration:line-through}
.diff ins{color:var(--good);text-decoration:none}
.banner{display:flex;gap:10px;align-items:center;font-size:13px;background:var(--marigold-soft);color:var(--marigold);border-radius:8px;padding:9px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);animation:toast .34s var(--ease);font-weight:500;bottom:max(22px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.copybox{display:flex;gap:8px;align-items:stretch}
.copybox pre{flex:1;margin:0;background:var(--surface-2);border-radius:8px;padding:12px;font:13px/1.5 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left;min-width:230px}
.yes{color:var(--good);font-weight:700}
.no{color:var(--line)}

/* guide bot */
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:max(18px,calc(env(safe-area-inset-bottom,0px) + 12px));z-index:35;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:12px 16px;display:flex;gap:8px;align-items:center;font-weight:600;box-shadow:var(--shadow);cursor:pointer}
.helplink{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--accent);text-decoration:none;justify-self:start}
.helplink:hover{text-decoration:underline}
.joinp{max-width:560px;gap:16px}
.joinp .code-in{font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.joinp .code-in::placeholder{text-transform:none;letter-spacing:normal;font-size:15px}
.inv-cards{display:none;gap:10px}
.invcard{display:grid;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;color:inherit;font:inherit;cursor:pointer;width:100%}
.invcard .spread{gap:10px}
@media (max-width:720px){ .inv-cards{display:grid} .inv-table{display:none} }
.callcard{display:grid;gap:10px;text-align:left;width:100%;border:1px solid var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%);border-radius:14px;padding:16px 18px;color:inherit;font:inherit;cursor:pointer;margin-bottom:16px}
.callcard .eyebrow{color:var(--accent);margin:0}
.cc-main{display:flex;align-items:center;gap:16px}
.cc-main>span{display:grid}
.cc-time{font:700 34px/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.cc-meta{display:flex;flex-wrap:wrap;gap:6px}
.cc-meta span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--muted)}

/* approval chain */
.chain{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;counter-reset:c}
.chain li{position:relative;display:grid;gap:6px;align-content:start;font-size:12.5px;color:var(--muted)}
.chain li::before{content:"";position:absolute;top:11px;left:24px;right:-6px;height:2px;background:var(--line)}
.chain li:last-child::before{display:none}
.chain li.done::before{background:var(--accent)}
.chain i{position:relative;z-index:1;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);font:600 11px var(--f-mono);font-style:normal;color:var(--muted)}
.chain li.done i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chain li.now i{border-color:var(--marigold);color:var(--marigold);background:var(--marigold-soft);box-shadow:0 0 0 4px var(--marigold-soft)}
.chain b{display:block;color:var(--fg);font-weight:600;font-size:12.5px;line-height:1.25}
.chain li.now b{color:var(--marigold)}
.chain small{display:block;font-size:11.5px;line-height:1.3}
.chain.mini{grid-template-columns:repeat(5,22px);gap:10px;margin:2px 0}
.chain.mini li::before{left:16px;right:-10px;top:8px}
.chain.mini i{width:18px;height:18px;font-size:9px;border-width:1.5px}
.chain-rej{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:13px}
@media (max-width:560px){ .chain:not(.mini){grid-template-columns:minmax(0,1fr);gap:10px} .chain:not(.mini) li{grid-template-columns:24px minmax(0,1fr);gap:10px} .chain:not(.mini) li::before{display:none} }
/* locks and attendance */
.lockpanel.locked{border-color:color-mix(in srgb,var(--marigold) 45%,var(--line));background:linear-gradient(0deg,var(--surface),color-mix(in srgb,var(--marigold-soft) 55%,var(--surface)))}
.okline,.lockline{display:flex;gap:10px;align-items:flex-start;margin:0;font-size:14px}
.okline svg{color:var(--good);flex:none;margin-top:2px}
.lockline svg{color:var(--marigold);flex:none;margin-top:2px}
/* tasks */
.kpis-sm{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis-sm .kpi{padding:12px 14px}
.kpis-sm .v{font-size:24px}
@media (max-width:640px){ .kpis-sm{grid-template-columns:repeat(2,minmax(0,1fr))} }
.taskbar{gap:10px;flex-wrap:wrap}
.taskbar .seg button{display:inline-flex;align-items:center;gap:6px}
.st-todo{--st:#8b97a3} .st-working{--st:#f2a33a} .st-stuck{--st:#e2445c} .st-done{--st:#20b26b}
#task-body{min-width:0;max-width:100%}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px;align-items:start;max-width:100%;min-width:0}
@media (max-width:640px){ .kanban{grid-template-columns:repeat(4,86%);scroll-snap-type:x mandatory} .kcol{scroll-snap-align:start} }
.kcol{background:var(--surface-2);border-radius:14px;padding:8px;display:grid;gap:8px;min-width:0}
.kcol header{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:9px;background:var(--st);color:#fff;font-size:13.5px}
.kcol header span{font:600 12px var(--f-mono);background:rgb(255 255 255 / .25);border-radius:999px;padding:1px 8px}
.kbody{display:grid;gap:8px}
.kempty{margin:6px 4px;font-size:13px;color:var(--muted)}
.tcard{display:grid;gap:10px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;color:inherit;font:inherit;cursor:pointer;box-shadow:0 1px 2px rgb(10 30 30 / .05);transition:transform .12s ease,box-shadow .12s ease,border-color .12s}
.tcard:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.tc-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tc-dept{font-size:12px;color:var(--muted)}
.tc-title{font-weight:600;line-height:1.35;font-size:14.5px}
.tc-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tc-n{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-left:auto}
.tag-issue{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--bad);background:var(--bad-soft);border-radius:5px;padding:2px 6px}
.prio{display:inline-block;font-size:11.5px;font-weight:600;border-radius:5px;padding:2px 7px}
.pr-low{background:var(--surface-2);color:var(--muted)} .pr-med{background:var(--info-soft);color:var(--info)} .pr-high{background:var(--marigold-soft);color:var(--marigold)} .pr-crit{background:var(--bad);color:#fff}
.faces{display:inline-flex}
.faces .av{box-shadow:0 0 0 2px var(--surface);margin-left:-6px}

.faces .more{font-size:11px;color:var(--muted);margin-left:4px;align-self:center}
.due{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:5px;padding:2px 7px}
.due.soon{background:var(--marigold-soft);color:var(--marigold)} .due.late{background:var(--bad-soft);color:var(--bad);font-weight:600}
.tgroup{margin-bottom:22px}
.tgroup h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:16px}
.tgroup h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--g)} .tgroup h3 span{font:500 12px var(--f-mono);color:var(--muted);margin-left:6px}
.g0{--g:#0b6b66} .g1{--g:#7b5cd6} .g2{--g:#d9822b} .g3{--g:#2b78c5} .g4{--g:#c2457a} .g5{--g:#4d8c2a}
.ttable td.stcell{background:var(--st);color:#fff;text-align:center;font-weight:600;font-size:13px;border-radius:6px;white-space:nowrap}
.ttable td{vertical-align:middle}
.tcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.tcal .dow{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.tday{min-height:96px;border:1px solid var(--line);border-radius:10px;padding:6px;display:grid;align-content:start;gap:4px;background:var(--surface);min-width:0}

.tasktag{background:var(--info-soft)!important;color:var(--info)!important}
.stpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stpick button{border:2px solid transparent;background:color-mix(in srgb,var(--st) 16%,var(--surface));color:var(--fg);border-radius:9px;padding:10px 6px;font:600 13px var(--f-body);cursor:pointer}
.stpick button[aria-pressed=true]{background:var(--st);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--st) 40%,transparent)}

.who{display:inline-flex;align-items:center;gap:6px;margin:0 10px 6px 0}
.tdetails{margin:12px 0 0;white-space:pre-wrap;line-height:1.55}
.tfeed{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.tfeed li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px}
.tfeed li p{margin:4px 0 0;white-space:pre-wrap}

.kindseg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;justify-self:start}
.kindseg label{display:block;cursor:pointer}
.kindseg input{position:absolute;opacity:0;pointer-events:none}
.kindseg span{display:block;padding:8px 14px;font-weight:500;font-size:14px;color:var(--muted)}
.kindseg input:checked+span{background:var(--fg);color:var(--bg)}
